<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0284c7" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!--
			Onest — текст, Unbounded — крупные заголовки. Оба содержат подмножество
			cyrillic-ext, где живут таджикские ӣ ӯ ҳ қ ғ ҷ: без него таджикская
			версия распалась бы на два разных шрифта.
			display=swap — текст читается сразу системным шрифтом, не дожидаясь
			загрузки: на слабом интернете это важнее красоты первых секунд.
		-->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&family=Unbounded:wght@700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
